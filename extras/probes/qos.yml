# Three Pods, one per QoS class. Check with:
#   kubectl get pod -o custom-columns=NAME:.metadata.name,QOS:.status.qosClass
apiVersion: v1
kind: Pod
metadata:
  name: qos-guaranteed
spec:
  containers:
  - name: ctr
    image: nginx:1.27
    resources:            # requests == limits for CPU and memory
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 128Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: qos-burstable
spec:
  containers:
  - name: ctr
    image: nginx:1.27
    resources:            # has requests, but limits are higher (or missing)
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: qos-besteffort
spec:
  containers:
  - name: ctr
    image: nginx:1.27     # no requests, no limits
