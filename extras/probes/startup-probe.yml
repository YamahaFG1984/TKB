# Startup probe demo: a "slow" app that needs ~40 seconds before it's usable.
# The startup probe allows up to 12 x 5s = 60s. Until it succeeds,
# liveness and readiness probes are not run, so the slow start doesn't cause restarts.
apiVersion: v1
kind: Pod
metadata:
  name: slow-start
spec:
  containers:
  - name: ctr
    image: busybox:1.36
    command: ["sh", "-c", "echo warming up...; sleep 40; touch /tmp/started; echo ready; sleep 3600"]
    startupProbe:
      exec:
        command: ["cat", "/tmp/started"]
      periodSeconds: 5
      failureThreshold: 12
    livenessProbe:
      exec:
        command: ["cat", "/tmp/started"]
      periodSeconds: 10
      failureThreshold: 3
    readinessProbe:
      exec:
        command: ["cat", "/tmp/started"]
      periodSeconds: 5
