# 5 work items, at most 2 running at a time.
# Indexed mode gives every Pod its own JOB_COMPLETION_INDEX (0-4).
apiVersion: batch/v1
kind: Job
metadata:
  name: batch-indexed
spec:
  completions: 5
  parallelism: 2
  completionMode: Indexed
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: worker
        image: busybox:1.36
        command: ["sh", "-c", "echo processing item $JOB_COMPLETION_INDEX; sleep 10; echo item $JOB_COMPLETION_INDEX done"]
