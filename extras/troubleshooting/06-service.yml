# A healthy Deployment fronted by two broken Services.
#   svc-typo:      selector has a typo (app: wbe) -> no endpoints
#   svc-wrongport: targetPort 8080, but nginx listens on 80 -> connection refused
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tb-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: svc-typo
spec:
  selector:
    app: wbe
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: svc-wrongport
spec:
  selector:
    app: web
  ports:
  - port: 80
    targetPort: 8080
