# Broken on purpose: requests far more CPU and memory than any node has.
# Symptom: Pod stays Pending (FailedScheduling).
apiVersion: v1
kind: Pod
metadata:
  name: tb-pending
  labels:
    chapter: troubleshooting
spec:
  containers:
  - name: ctr
    image: nginx:1.27
    resources:
      requests:
        cpu: "64"
        memory: 500Gi
