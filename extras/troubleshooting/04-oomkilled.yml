# Broken on purpose: "tail /dev/zero" keeps buffering memory until it hits the limit.
# Symptom: OOMKilled (exit code 137) -> CrashLoopBackOff.
apiVersion: v1
kind: Pod
metadata:
  name: tb-oomkilled
  labels:
    chapter: troubleshooting
spec:
  containers:
  - name: ctr
    image: busybox:1.36
    command: ["sh", "-c", "tail /dev/zero"]
    resources:
      requests:
        memory: 32Mi
      limits:
        memory: 64Mi
